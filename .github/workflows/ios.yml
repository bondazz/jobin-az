name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies & CocoaPods
        run: |
          flutter pub get
          cd ios
          pod install
        working-directory: ./Jooble-app

      - name: Xcodebuild Unsigned Binary
        run: |
          if [ -d "ios/Runner.xcworkspace" ]; then
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi
        working-directory: ./Jooble-app
        shell: bash

      - name: Find Runner.app and Package IPA
        run: |
          RUNNER_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $RUNNER_PATH"
          if [ -n "$RUNNER_PATH" ]; then
            BASE_DIR=$(dirname "$RUNNER_PATH")
            cd "$BASE_DIR"
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r Jooble.ipa Payload
          else
            echo "Runner.app not found!"
            exit 1
          fi
        working-directory: ./Jooble-app
        shell: bash

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jooble-iOS-IPA
          path: Jooble-app/**/Jooble.ipa
