name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies and CocoaPods
        run: |
          flutter pub get
          cd ios && pod install || true
        working-directory: ./Jooble-app

      - name: Flutter Pre-build iOS Assets
        run: flutter build ios --release --no-codesign || true
        working-directory: ./Jooble-app

      - name: Xcodebuild Unsigned App Binary
        run: |
          cd Jooble-app
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO BUILD_DIR=build
        shell: bash

      - name: Package Payload to IPA
        run: |
          cd Jooble-app/build/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Jooble.ipa Payload
        shell: bash

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jooble-iOS-IPA
          path: Jooble-app/build/Release-iphoneos/Jooble.ipa
