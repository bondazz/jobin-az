name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies and CocoaPods
        run: |
          flutter pub get
          cd ios
          pod install
        working-directory: ./Jooble-app

      - name: Build Unsigned iOS App Bundle
        run: flutter build ios --release --no-codesign
        working-directory: ./Jooble-app

      - name: Package Payload into IPA
        run: |
          cd Jooble-app
          RUNNER_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $RUNNER_PATH"
          BASE_DIR=$(dirname "$RUNNER_PATH")
          cd "$BASE_DIR"
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Jooble.ipa Payload
        shell: bash

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jooble-iOS-IPA
          path: Jooble-app/**/Jooble.ipa
